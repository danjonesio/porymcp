# docker-compose.tls.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build
#
# Adds Caddy in front of PoryMCP. Does not unpublish 8080:8080, since Compose
# merges ports additively, and the direct-hit acceptance check needs the
# published container port.
#
# The Caddy image is a floating 2.x alpine tag on purpose. This overlay is a
# localhost TLS demonstration, the PoryMCP image never contains Caddy, and an
# operator who fronts PoryMCP with a proxy pins their own.

services:
  porymcp:
    environment:
      PUBLIC_URL: https://localhost
      TRUSTED_PROXIES: 172.28.0.4/32

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      porymcp:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.28.0.4

networks:
  default:
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.28.0.0/16
