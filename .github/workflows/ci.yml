name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # A manual run from main re-publishes edge without a new commit; from a tag
  # it re-publishes that tag; either way verify then runs against the new
  # digest. From any other ref the checks run and publish and verify are
  # skipped. Only users with write access can trigger it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # setup-go restores GOCACHE, which holds test results; a cached result
      # prints no PASS line and would fail the guard step below. Go ignores
      # the flag for vet, build and run.
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # setup-go reads the toolchain line in go.mod, installs that release and
      # sets GOTOOLCHAIN=local for the job, so this is the compiler and
      # nothing is downloaded; under GOTOOLCHAIN=local only the go line is
      # enforced (docs/08-docker.md).
      - run: go version
      - run: make vet
      # The Go suites under the race detector; a race fails the job with
      # DATA RACE in the log. setup-go saves its cache only when its key (the
      # toolchain and go.sum) is new, so the race build compiles cold until
      # one of them next changes on main.
      - run: make test-race
      # The two tracked-file guards skip themselves when .git is absent, and
      # the owner guard's repository check needs GITHUB_ACTIONS, so a green
      # suite is not proof they ran. The pin guards are listed so a deleted
      # test is noticed. Assert the PASS lines.
      - name: Tracked-file guards ran and passed
        shell: bash
        run: |
          go test ./cmd/server -run 'TestNoInternalReferences|TestProseStyle|TestOwnerConsistent|TestNodeMajorConsistent|TestGoToolchainConsistent|TestDockerfilePinned|TestVulnPinned|TestImageJobsGated' -v | tee "$RUNNER_TEMP/guards.log"
          grep -q -- '--- PASS: TestNoInternalReferences' "$RUNNER_TEMP/guards.log"
          grep -q -- '--- PASS: TestProseStyle' "$RUNNER_TEMP/guards.log"
          grep -q -- '--- PASS: TestOwnerConsistent' "$RUNNER_TEMP/guards.log"
          grep -q -- '--- PASS: TestNodeMajorConsistent' "$RUNNER_TEMP/guards.log"
          grep -q -- '--- PASS: TestGoToolchainConsistent' "$RUNNER_TEMP/guards.log"
          grep -q -- '--- PASS: TestDockerfilePinned' "$RUNNER_TEMP/guards.log"
          grep -q -- '--- PASS: TestVulnPinned' "$RUNNER_TEMP/guards.log"
          grep -q -- '--- PASS: TestImageJobsGated' "$RUNNER_TEMP/guards.log"
      - run: make vuln

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The unit tests run before npm ci, with no web/node_modules on the
      # runner, which proves on every run that they import only Node's
      # built-ins and each other. That is what lets make test run them
      # without an install.
      - run: make web-test
      - run: cd web && npm ci --no-audit --no-fund
      # next-env.d.ts is git-ignored and is the only file that pulls in Next's
      # ambient module declarations, so the type check runs after the build
      # that writes it. The build also rewrites web/out; no step diffs it.
      - run: make web
      - run: make web-typecheck
      - run: make web-lint
      # npm ci above runs with --no-audit; this step is the gate. It runs last
      # so a new advisory cannot hide a build, type check, lint or test result.
      - run: make web-audit

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same pin as the go job, so Dependabot moves both together. The
      # module cache is not restored: the stub is standard library only.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The echo upstream the smoke script registers (scripts/echostub). It
      # is built outside the tree: .gitignore ignores a binary named porymcp
      # at any path, and nothing from the runner's checkout is committed.
      - name: Build the echo stub
        run: go build -o "$RUNNER_TEMP/echostub" ./scripts/echostub
      # Node for the browser suite (web/e2e, PORM-157), at the web job's pin
      # so Dependabot moves both together; the npm cache is the one the web
      # job saves under the lockfile's hash. These steps sit before the image
      # build so a broken install fails before the slow part.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the dashboard's dependencies
        timeout-minutes: 3
        run: cd web && npm ci --ignore-scripts --no-audit --no-fund
      # The browser cache is keyed on the installed Playwright version and has
      # no fallback key: another version's browser is dead weight that would
      # be saved again under the new key. A bump misses once, then hits.
      - name: Read the Playwright version
        id: pwv
        run: echo "version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pwv.outputs.version }}
      # The headless shell is all a headless run needs. On a cache hit the
      # download is skipped; the apt libraries are installed on every run.
      - name: Install the Chromium headless shell
        timeout-minutes: 5
        run: cd web && npx --no-install playwright install --with-deps --only-shell chromium
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # One cache scope per platform, so the publish job below reads both
      # instead of the last writer's.
      - name: Build the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: porymcp:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
      # The image checks live in scripts/image-check.sh, which the
      # docker-arm64 and verify jobs run too. Both keys are minted inside it
      # and never leave its process: GITHUB_ENV would print them in a later
      # step's header. The smoke script registers the admin key and each
      # minted key as a mask through file descriptor 3, which this step points
      # at its own stdout, so the mask lines reach the runner and never the
      # captured output the script greps. The browser suite (PORM-157) runs
      # after the smoke script against the same container and stub, and its
      # report is moved to the upload path only after scripts/e2e-scrub.sh has
      # withheld every key form and checked the result.
      - name: The image starts, answers /health, serves the dashboard, passes the smoke script and the browser suite
        shell: bash
        timeout-minutes: 10
        env:
          IMAGE_CHECK_REF: porymcp:ci
          IMAGE_CHECK_ARCH: amd64
          IMAGE_CHECK_STUB: ${{ runner.temp }}/echostub
          IMAGE_CHECK_E2E: '1'
        run: bash scripts/image-check.sh 3>&1
      # Both logs pass through the script's filter, which withholds virtual
      # key shapes, the stored literals and any 64-hex value (the shape of
      # both keys), so the one case where a key reached a log never publishes
      # it. The live log is read, not a file captured earlier.
      - name: Container and stub logs
        if: failure()
        run: bash scripts/image-check.sh --logs
      - name: Remove the container
        if: always()
        run: docker rm -f porymcp-ci || true
      # The browser suite's report, present only when the main step moved it
      # here after the scrub withheld every key form and its check found
      # nothing. A green run skips this step; a red smoke, a scrub hit or a
      # timeout leaves no directory, so nothing uploads then either.
      - name: Upload the browser suite's report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ${{ runner.temp }}/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      # The build stage cross-compiles by argument, the way publish builds
      # arm64. This build fills the arm64 cache scope publish reads, and the
      # check below is a cheap first look at the cross-compiled binary, which
      # a manifest cannot give: buildx stamps the platform from the request,
      # not from the artefact. The docker-arm64 job runs an arm64 image.
      # Nothing from this build is pushed. Without provenance: false the action
      # would attach a mode=max attestation computed over the event payload.
      - name: Build the arm64 image to a directory
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          provenance: false
          outputs: type=local,dest=${{ runner.temp }}/arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
      - name: The arm64 binary is arm64
        shell: bash
        run: file "$RUNNER_TEMP/arm64/porymcp" | grep -q 'ARM aarch64'

  # The image built natively on an arm64 host and run through the same image
  # checks as the amd64 image, so publish never pushes an arm64 image whose
  # recipe has not run on arm64. Both build stages run on the builder's own
  # architecture, so these are not the bytes publish pushes: publish
  # cross-compiles on amd64, and the verify job below is the first run of the
  # published bytes. No cache: a native build would replace the cross-built
  # layers in the arm64 scope publish reads. Nothing here authenticates.
  docker-arm64:
    name: docker-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the echo stub
        run: go build -o "$RUNNER_TEMP/echostub" ./scripts/echostub
      # The same line in the verify job.
      - name: The file command is installed
        timeout-minutes: 3
        run: command -v file >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends file; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Nothing from this build is pushed. Without provenance: false the action
      # would attach a mode=max attestation computed over the event payload.
      - name: Build the arm64 image natively
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          tags: porymcp:ci
      - name: The arm64 image starts, answers /health, serves the dashboard and passes the smoke script
        shell: bash
        timeout-minutes: 10
        env:
          IMAGE_CHECK_REF: porymcp:ci
          IMAGE_CHECK_ARCH: arm64
          IMAGE_CHECK_STUB: ${{ runner.temp }}/echostub
        run: bash scripts/image-check.sh 3>&1
      - name: Container and stub logs
        if: failure()
        run: bash scripts/image-check.sh --logs
      - name: Remove the container
        if: always()
        run: docker rm -f porymcp-ci || true

  publish:
    needs: [go, web, docker, docker-arm64]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # The index digest, for the verify job to pull by. Not a secret.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # The default annotates per-platform manifests only. The registry
          # reads the index for a multi-platform image, so annotate both.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          # Derived from the repository, so the published path cannot drift
          # from the owner named in go.mod and the README. A tag with a hyphen
          # (a release candidate) is published under its own name only.
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Provenance stays at mode=min. mode=max would publish the whole build
      # definition, build arguments included, so no build argument may ever
      # carry a secret.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=min
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
      # This proves the index shape. The verify job pulls the index by this
      # digest and runs it on each platform.
      - name: The published index lists both platforms
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'the build gave no digest'; exit 1; }
          docker buildx imagetools inspect "$IMAGE@$DIGEST" | tee "$RUNNER_TEMP/index.txt"
          grep -q 'linux/amd64' "$RUNNER_TEMP/index.txt"
          grep -q 'linux/arm64' "$RUNNER_TEMP/index.txt"
          echo "Published \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  # The published index pulled by digest with no credential and run through
  # the same image checks, once on each platform. This is the first run of
  # the bytes publish pushed. It is a signal after publish, not a gate: by
  # the time it runs the tags have moved, and a red verify means the next
  # patch tag (docs/13-releasing.md). The pull uses an empty client config
  # and the job holds no login, no secret and no packages permission, so a
  # private package fails the pull.
  verify:
    name: verify (${{ matrix.arch }})
    needs: publish
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      REPO: ghcr.io/${{ github.repository }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the echo stub
        run: go build -o "$RUNNER_TEMP/echostub" ./scripts/echostub
      # The same line in the docker-arm64 job.
      - name: The file command is installed
        timeout-minutes: 3
        run: command -v file >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends file; }
      - name: Pull the published index by digest with no credential
        shell: bash
        timeout-minutes: 5
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'publish gave no digest'; exit 1; }
          export DOCKER_CONFIG="$RUNNER_TEMP/anon-docker"
          mkdir -p "$DOCKER_CONFIG"
          echo '{}' > "$DOCKER_CONFIG/config.json"
          echo "pulling with an empty client config at $DOCKER_CONFIG (no registry login in this job)"
          docker pull "$REPO@$DIGEST"
          docker image inspect --format '{{json .RepoDigests}}' "$REPO@$DIGEST" | grep -qF "$REPO@$DIGEST"
      - name: The published image starts, answers /health, serves the dashboard and passes the smoke script
        shell: bash
        timeout-minutes: 10
        env:
          IMAGE_CHECK_REF: ${{ env.REPO }}@${{ env.DIGEST }}
          IMAGE_CHECK_ARCH: ${{ matrix.arch }}
          IMAGE_CHECK_STUB: ${{ runner.temp }}/echostub
        run: bash scripts/image-check.sh 3>&1
      - name: Container and stub logs
        if: failure()
        run: bash scripts/image-check.sh --logs
      - name: Remove the container
        if: always()
        run: docker rm -f porymcp-ci || true
