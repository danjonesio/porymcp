name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # A manual run from main re-publishes edge without a new commit; from a tag
  # it re-publishes that tag; from any other ref the checks run and publish
  # is skipped. Only users with write access can trigger it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # setup-go restores GOCACHE, which holds test results; a cached result
      # prints no PASS line and would fail the guard step below. Go ignores
      # the flag for vet, build and run.
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # setup-go reads the toolchain line in go.mod, installs that release and
      # sets GOTOOLCHAIN=local for the job, so this is the compiler and a
      # mismatch would fail rather than download.
      - run: go version
      - run: make vet
      - run: make test
      # The two tracked-file guards skip themselves when .git is absent, and
      # the owner guard's repository check needs GITHUB_ACTIONS, so a green
      # suite is not proof they ran. Assert the PASS lines.
      - name: Tracked-file guards ran and passed
        shell: bash
        run: |
          go test ./cmd/server -run 'TestNoInternalReferences|TestProseStyle|TestOwnerConsistent|TestNodeMajorConsistent|TestDockerfilePinned|TestVulnPinned' -v | tee "$RUNNER_TEMP/guards.log"
          grep -q -- '--- PASS: TestNoInternalReferences' "$RUNNER_TEMP/guards.log"
          grep -q -- '--- PASS: TestProseStyle' "$RUNNER_TEMP/guards.log"
          grep -q -- '--- PASS: TestOwnerConsistent' "$RUNNER_TEMP/guards.log"
          grep -q -- '--- PASS: TestNodeMajorConsistent' "$RUNNER_TEMP/guards.log"
          grep -q -- '--- PASS: TestDockerfilePinned' "$RUNNER_TEMP/guards.log"
          grep -q -- '--- PASS: TestVulnPinned' "$RUNNER_TEMP/guards.log"
      - run: make vuln

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund
      # next-env.d.ts is git-ignored and is the only file that pulls in Next's
      # ambient module declarations, so the type check runs after the build
      # that writes it. The build also rewrites web/out; no step diffs it.
      - run: make web
      - run: make web-typecheck
      - run: make web-lint
      - run: make web-test
      # npm ci above runs with --no-audit; this step is the gate. It runs last
      # so a new advisory cannot hide a build, type check, lint or test result.
      - run: make web-audit

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same pin as the go job, so Dependabot moves both together. The
      # module cache is not restored: the stub is standard library only.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The echo upstream the smoke script registers (scripts/echostub). It
      # is built outside the tree: .gitignore ignores a binary named porymcp
      # at any path, and nothing from the runner's checkout is committed.
      - name: Build the echo stub
        run: go build -o "$RUNNER_TEMP/echostub" ./scripts/echostub
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # One cache scope per platform, so the publish job below reads both
      # instead of the last writer's.
      - name: Build the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: porymcp:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
      # Both keys are set, so the server never logs a generated admin key.
      # They are minted here, live for this one container, and are not
      # secrets. Nothing in this step echoes them and set -x is never used.
      # The smoke script registers the admin key and each minted key as a
      # mask through file descriptor 3, which this step points at its own
      # stdout, so the mask lines reach the runner and never the captured
      # output the grep below reads. The script runs in this step because
      # the admin key lives in this shell: GITHUB_ENV would print it in a
      # later step's header.
      - name: The image starts, answers /health, serves the dashboard and passes the smoke script
        shell: bash
        timeout-minutes: 5
        run: |
          ADMIN_API_KEY="$(openssl rand -hex 32)"
          ENCRYPTION_KEY="$(openssl rand -hex 32)"
          [ -n "$ADMIN_API_KEY" ] && [ -n "$ENCRYPTION_KEY" ]
          export ADMIN_API_KEY ENCRYPTION_KEY
          # The echo stub listens on the bridge gateway, which is what
          # host-gateway resolves to inside the container, and nowhere else.
          # Its log is read only by the greps below and the failure step.
          gw="$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')"
          [ -n "$gw" ]
          "$RUNNER_TEMP/echostub" -addr "$gw:8098" > "$RUNNER_TEMP/echostub.log" 2>&1 &
          stub_pid=$!
          trap 'kill "$stub_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 10); do
            if curl -s -o /dev/null --max-time 1 "http://$gw:8098/v1/ok"; then
              stub=yes
              break
            fi
            sleep 1
          done
          [ "${stub:-}" = yes ]
          docker run -d --name porymcp-ci -p 8080:8080 --add-host=host.docker.internal:host-gateway -e ADMIN_API_KEY -e ENCRYPTION_KEY porymcp:ci
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:8080/health 2>/dev/null | grep -q '"status":"ok"'; then
              ok=yes
              break
            fi
            sleep 1
          done
          [ "${ok:-}" = yes ]
          # The startup line and the image's guard defaults (PORM-79). Logged
          # before the listener opens, so it is there once /health answers.
          docker logs porymcp-ci > "$RUNNER_TEMP/porymcp.log" 2>&1
          grep -qF '"msg":"upstream guard","allow_loopback":false,"deny_private":false' "$RUNNER_TEMP/porymcp.log"
          curl -fsS -o "$RUNNER_TEMP/index.html" -w '%{http_code} %{content_type}\n' http://localhost:8080/ | grep -q '^200 text/html'
          grep -q '<title>PoryMCP</title>' "$RUNNER_TEMP/index.html"
          # The smoke script (PORM-213): two upstreams, a group, three keys,
          # the four MCP doors, the relay, a revoke and the audit rows. Its
          # output is checked before it is printed, so a leak never reaches
          # the job log and a later read of the log proves nothing. The stored
          # credentials are smokeplain followed by alpha or bravo; the regex
          # is written so the step's own text never matches it.
          smoke_status=0
          STUB_URL=http://host.docker.internal:8098 SMOKE_BASE=http://localhost:8080 bash scripts/smoke.sh 3>&1 > "$RUNNER_TEMP/smoke.out" 2>&1 || smoke_status=$?
          if grep -qE 'smokeplain(alpha|bravo)|pory_[0-9a-f]{16,}' "$RUNNER_TEMP/smoke.out" || grep -qF -e "$ADMIN_API_KEY" -e "$ENCRYPTION_KEY" "$RUNNER_TEMP/smoke.out"; then
            echo 'the smoke output carries a stored credential or a key'
            exit 1
          fi
          cat "$RUNNER_TEMP/smoke.out"
          # The log is captured once and grepped from the file: grep -q on a
          # pipe exits at the first match, docker logs can then die of
          # SIGPIPE, and under pipefail the if reads a match as no match.
          docker logs porymcp-ci > "$RUNNER_TEMP/porymcp.log" 2>&1
          if grep -q admin_api_key "$RUNNER_TEMP/porymcp.log"; then
            echo 'the container log carries an admin key field'
            exit 1
          fi
          if grep -qF -e "$ADMIN_API_KEY" -e "$ENCRYPTION_KEY" "$RUNNER_TEMP/porymcp.log"; then
            echo 'the container log carries a key value'
            exit 1
          fi
          if grep -qE 'smokeplain(alpha|bravo)|pory_[0-9a-f]{16,}' "$RUNNER_TEMP/porymcp.log"; then
            echo 'the container log carries a stored credential or a virtual key'
            exit 1
          fi
          if grep -qE 'smokeplain(alpha|bravo)|pory_[0-9a-f]{16,}' "$RUNNER_TEMP/echostub.log"; then
            echo 'the stub log carries a stored credential or a virtual key'
            exit 1
          fi
          exit "$smoke_status"
      # Both logs pass through a filter that withholds virtual key shapes,
      # the stored literals and any 64-hex value (the shape of both keys
      # minted above), so the one case where a key reached a log never
      # publishes it. The live log is read, not the file captured above,
      # which a failure earlier in the step would leave stale.
      - name: Container and stub logs
        if: failure()
        run: |
          { docker logs porymcp-ci 2>&1; echo '--- echostub'; cat "$RUNNER_TEMP/echostub.log" 2>/dev/null; } | grep -v admin_api_key | sed -E 's/pory_[0-9a-f]{16,}/pory_<withheld>/g; s/smokeplain(alpha|bravo)/<withheld>/g; s/[0-9a-f]{64}/<withheld>/g' || true
      - name: Remove the container
        if: always()
        run: docker rm -f porymcp-ci || true
      # The build stage cross-compiles by argument. Extract the arm64 image and
      # check the binary really is arm64, which a manifest cannot show: buildx
      # stamps the platform from the request, not from the artefact.
      # Nothing from this build is pushed. Without provenance: false the action
      # would attach a mode=max attestation computed over the event payload.
      - name: Build the arm64 image to a directory
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          provenance: false
          outputs: type=local,dest=${{ runner.temp }}/arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
      - name: The arm64 binary is arm64
        shell: bash
        run: file "$RUNNER_TEMP/arm64/porymcp" | grep -q 'ARM aarch64'

  publish:
    needs: [go, web, docker]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # The default annotates per-platform manifests only. The registry
          # reads the index for a multi-platform image, so annotate both.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          # Derived from the repository, so the published path cannot drift
          # from the owner named in go.mod and the README. A tag with a hyphen
          # (a release candidate) is published under its own name only.
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Provenance stays at mode=min. mode=max would publish the whole build
      # definition, build arguments included, so no build argument may ever
      # carry a secret.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=min
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
      # This proves the index shape. The docker job's file check, which this
      # job needs, proved the arm64 binary.
      - name: The published index lists both platforms
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" | tee "$RUNNER_TEMP/index.txt"
          grep -q 'linux/amd64' "$RUNNER_TEMP/index.txt"
          grep -q 'linux/arm64' "$RUNNER_TEMP/index.txt"
          echo "Published \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
