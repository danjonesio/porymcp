# Dependabot config for danjonesio/porymcp. Written by /d-github on 2026-09-15.
#
# Deploy on merge: yes for cmd/, internal/, web/, go.mod, go.sum and
# openapi.yaml, the paths the Dockerfile copies, because the publish job in
# .github/workflows/ci.yml runs on every push to main and pushes
# ghcr.io/danjonesio/porymcp:edge and :sha-<short>. Nothing else goes live on
# its own: the Coolify dev instance pulls edge only when Dan presses Redeploy,
# and README.md tells production to pin a digest.
# No for .github/workflows/ and the compose files, which the image never
# contains.
#
# Every entry is a version lane, on Dan's decision of 2026-09-15 ("whichever
# is most thorough") and on PORM-42, which asks for version updates on all
# four ecosystems so the digest pins move deliberately. The standard's default
# for a deploying path is security-only; the reasons for going wider are that
# a merge republishes edge from whatever sources it changed while the deploy
# itself is a hand press, and that a pin nothing watches is the drift PORM-42
# exists to stop. Monthly rather than PORM-42's weekly: the default-branch
# ruleset requires an up-to-date branch, so every open PR rebases after every
# merge, and fewer grouped PRs cost fewer CI runs. Each lane carries two
# groups, so a bump month is one PR and an advisory wave is one PR.
#
# github-actions (/): version lane. 13 of 13 uses: lines in .github/workflows
# are SHA-pinned (grep -rEho 'uses: [^ ]+@[0-9a-f]{40}'), so nothing moves
# them but this, and the workflow files are not part of the image.
#
# gomod (/): version lane. go.sum is copied into the image (Dockerfile, COPY
# go.mod go.sum); the go job's govulncheck step is the check a bump has to
# pass. The scanner itself is a tool directive in go.mod and make vuln runs
# go tool govulncheck, so this lane moves its version too, through an allow
# rule named for it: go get -tool writes a tool module's require line as
# indirect, and without the rule the lane would skip it (dependabot-core,
# read 2026-09-22). The four modules that build the scanner (golang.org/x/vuln,
# x/tools, x/mod, x/telemetry) are downloaded by the image build and never
# linked, so an advisory against one of them is not a product advisory, and
# is still taken, because these are the libraries the scanner reads with.
# The check any gomod pull request has to pass is in CONTRIBUTING.md.
#
# npm (/web): version lane. web/package-lock.json builds the dashboard in the
# image's web stage; the web job ends with npm audit --audit-level=high, which
# failed on PR #21 on 2026-09-15 for a js-yaml advisory nothing was watching.
#
# docker (/): version lane. All three FROM lines in the Dockerfile are
# digest-pinned (node:22-alpine, golang:1.26-alpine and
# gcr.io/distroless/static-debian12:nonroot, each @sha256). How a pin moves,
# by this lane or by hand, is in docs/08-docker.md.
#
# Not covered, on purpose:
#   - docker-compose (docker-compose.yml, docker-compose.tls.yml): no
#     docker-compose lane. The image never contains these files, their
#     image: tags float (postgres:16-alpine, caddy:2.10-alpine) or name a
#     local build (porymcp:local from build: .), and a digest pin with no
#     lane to move it is the drift named above.
#
# Held back, on purpose, each by an ignore entry in its lane:
#   - npm: typescript 7 and above, and eslint 10 and above, because the lint
#     stack inside eslint-config-next refuses both. These are version
#     ranges, and a version range also holds back a security update whose
#     every fixed version is inside it (dependabot-core ignore_condition.rb,
#     read 2026-09-22); the alert still shows on the Security tab, and make
#     web-audit in the web job fails at high or critical on the next push.
#     Both are build and lint tools; no code from them ships in web/out or
#     the image.
#   - docker: every node major, because a Node major moves web/.nvmrc, the
#     Dockerfile and the web/out rebuild together and is made by hand
#     (docs/08-docker.md). The lane still evaluates node and can offer a
#     digest refresh of the current major.
#
# The comment ignores set on PR #25 and PR #27 on 2026-09-21 stay in
# Dependabot's state; the entries below are the record.
#
# Dependabot does not raise security updates for the docker ecosystem:
# GitHub's supported-ecosystems table lists version updates as supported and
# security updates as not supported for it (read 2026-09-21). The docker
# lane's security group is written as the standard shapes it and opens
# nothing.
#
# No commit-message prefix: the last 30 subjects carry no conventional prefix
# (PORM-NN: is the shape), so Dependabot's own default stands.
#
# This file's own path is not part of the image; a merge of it triggers CI as
# every merge to main does and republishes edge from unchanged sources.

version: 2
updates:
  # Version lane: the workflow files are not part of the image; SHA pins never
  # move on their own.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions-versions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # Version lane on a deploying path, by the decision in the header: go.sum is
  # in the image. govulncheck is a tool directive in go.mod, go get -tool
  # writes its require line as indirect, and the version lane skips indirect
  # modules, so the second allow rule names the scanner and the first keeps
  # the default for everything else.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
      - dependency-name: "golang.org/x/vuln"
        dependency-type: "all"
    groups:
      gomod-versions:
        applies-to: version-updates
        patterns: ["*"]
      gomod-security:
        applies-to: security-updates
        patterns: ["*"]

  # Version lane on a deploying path, by the decision in the header: the
  # lockfile builds the dashboard in the image. Two majors are held back by
  # the ignore entries below.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint inside eslint-config-next refuses TS 7.0, so make
      # web-lint throws (PR #25, 2026-09-21). Lift when eslint-config-next
      # ships a typescript-eslint that accepts it (typescript-eslint issue
      # 10940).
      - dependency-name: "typescript"
        versions: [">=7"]
      # ESLint 10 calls scopeManager.addGlobals, which the bundled parser
      # lacks, and three bundled plugins accept ESLint up to 9 (PR #25,
      # 2026-09-21). Lift when eslint-config-next supports ESLint 10.
      - dependency-name: "eslint"
        versions: [">=10"]
    groups:
      npm-versions:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # Version lane on a deploying path, by the decision in the header: the three
  # digest-pinned FROM lines are the image. Node majors are held back by the
  # ignore entry below.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # A Node major is a deliberate change: web/.nvmrc, the Dockerfile and
      # the web/out rebuild move together, and TestNodeMajorConsistent fails
      # any pull request that moves the Dockerfile alone (PR #27 offered 25 on
      # 2026-09-21, PR #36 offered 26 on 2026-09-22). Lift only if this lane
      # should raise Node majors; until then a major moves by hand
      # (docs/08-docker.md).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-versions:
        applies-to: version-updates
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
